<!DOCTYPE html>
<html>
<head>
  <title>TikTok Auth Callback</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 80px auto; padding: 0 24px; background: #f9f9f9; color: #111; }
    h2 { font-size: 20px; margin-bottom: 8px; }
    .box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 16px; }
    code { display: block; background: #f0f0f0; padding: 10px 14px; border-radius: 5px; font-size: 13px; word-break: break-all; margin: 10px 0; }
    button { padding: 8px 18px; background: #0066ff; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0052cc; }
    .muted { color: #777; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>TikTok Authorization</h2>
  <div class="box" id="out">Checking for auth code…</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('auth_code');
    const out = document.getElementById('out');
    if (code) {
      out.innerHTML =
        '<p style="margin:0 0 8px">Auth code received — copy it and paste it into Claude Code:</p>' +
        '<code id="c">' + code + '</code>' +
        '<button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Copied!\'">Copy to clipboard</button>' +
        '<p class="muted">You can close this tab after copying.</p>';
    } else {
      out.innerHTML =
        '<p style="margin:0">This page is the TikTok OAuth callback for the Pilothouse internal analytics tool.</p>' +
        '<p class="muted">No auth code in URL — this page is only active during the authorization flow.</p>';
    }
  </script>
</body>
</html>
